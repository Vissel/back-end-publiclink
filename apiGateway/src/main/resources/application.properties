server.port=8080
# API Gateway context path (WebFlux compatible)
spring.webflux.base-path=/
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
# WebFlux Configuration (Reactive, Non-blocking)
server.netty.connection-timeout=60000
# Logging configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG
# Authentication service (SSL/mTLS Configuration)
server.ssl.enabled=false
# Use 'need' to force the client to provide a certificate
#server.ssl.client-auth=need
# Trust Store (Who the server trusts)
server.ssl.key-store=classpath:auth-service/gateway.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=macbook2019
server.ssl.trust-store=classpath:auth-service/truststore.jks
server.ssl.trust-store-password=macbook2019
# RabbitMQ configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000
# Publisher confirms and returns
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
# Template settings
spring.rabbitmq.template.mandatory=true
spring.config.import=classpath:ratelimiter/ratelimiter.yml
# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
# Downstream service URLs (configurable per environment)
publiclink.service.url=${PUBLICLINK_SERVICE_URL:http://localhost:9080}
user.service.url=${USER_SERVICE_URL:http://localhost:8082}

# JWT configuration
jwt.secret=${JWT_KEY}
jwt.expiration=3600000
jwt.refresh-expiration=86400000
# Logging
logging.level.com.example.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
# RSA key pair used to decrypt the login password. RsaService reads these with
# java.nio.file.Paths, so they MUST be absolute filesystem paths — a classpath:
# prefix will not resolve. Ship the PEMs from apiGateway/src/main/resources/
# auth-service/ to the directory below on the server.
rsa-private-key.path=${RSA_PRIVATE_KEY_PATH:/opt/publiclink/keys/auth260222.pem}
rsa-pubkey.path=${RSA_PUBKEY_PATH:/opt/publiclink/keys/pubauth.pem}
spring.main.allow-bean-definition-overriding=true
rate-limit:
  enabled: true
  redis-key-prefix: "rl:"
  fallback-strategy: DENY

  default-policy:
    capacity: 100
    refill-token: 10
    refill-period-seconds: 60
    order: 0

  policies:
    - path-pattern: "/api/v1/auth/**"
      capacity: 10
      refill-token: 10
      refill-period-seconds: 60
      order: 1

    - path-pattern: "/publiclink/**"
      capacity: 50
      refill-token: 50
      refill-period-seconds: 60
      order: 10

    # Chat bridge traffic (served by chat-app): a visitor sends a message plus
    # debounced typing beacons, so a chat window costs several requests per minute,
    # not one.
    - path-pattern: "/chat/api/v1/chat/**"
      capacity: 120
      refill-token: 120
      refill-period-seconds: 60
      order: 15

    - path-pattern: "/api/v1/user/**"
      capacity: 10
      refill-token: 10
      refill-period-seconds: 60
      order: 20
  exclude-paths:
    - "/api/v1/health/**"
    - "/api/v1/healthcheck/**"
    # Zalo deliveries are authenticated by signature, not by quota. Answering a
    # webhook with 429 makes Zalo retry and eventually disable it outright.
    - "/chat/api/v1/chat/zalo/webhook"
    # One long-lived event stream per visitor, not a per-request budget.
    - "/chat/api/v1/chat/stream"
    - "/chat/admin/v1/chat/stream"

management:
  endpoints:
    web:
    exposure:
      include: health,info,metrics,ratelimiter
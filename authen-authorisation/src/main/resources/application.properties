application.name=AuthenticationAuthorisationApplication
server.servlet.context-path=/authen-authorisation
server.port=8081
server.address=0.0.0.0
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/publiclink-db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=newuser02
spring.datasource.password=newuser002
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Pool sizing. This service and publiclink-app both connect as newuser02, so
# the two JVMs draw from the same hourly MySQL resource limits and the same
# MAX_USER_CONNECTIONS cap: Hikari's default minimum-idle equals the ceiling
# (10), so two boots alone can hold 20 connections against a cap of 10 and
# every new physical connection costs session-init statements against the
# question quota. Keep this service small; see
# deploy/mysql/split-authen-db-user.sql to move it onto its own account.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000


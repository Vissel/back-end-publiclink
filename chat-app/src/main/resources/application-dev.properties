server.port=9090
server.address=0.0.0.0
# MySQL Database Configuration (schema: chat_schema, owned by this service)
# The schema must exist before the first start; Liquibase only creates the tables:
#   CREATE DATABASE chat_schema; GRANT ALL ON chat_schema.* TO '<user>'@'localhost';
spring.datasource.url=jdbc:mysql://localhost:3306/chat_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Formysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Liquibase Configuration — this module owns its own changelog and schema, so it
# cannot collide with publiclink-db (publiclink-app is the sole DDL owner there).
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

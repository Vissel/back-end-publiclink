spring.application.name=ChatApplication
spring.webflux.base-path=/chat
server.port=${CHAT_SERVER_PORT:9090}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
# MySQL Database Configuration (schema: chat_schema)
# CHAT_DB_* deliberately, not DB_*: DB_* belongs to publiclink-app and USER_DB_*
# to the user service, and all three read the same EnvironmentFile.
spring.datasource.url=${CHAT_DB_URL:jdbc:mysql://localhost:3306/chat_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${CHAT_DB_USERNAME}
spring.datasource.password=${CHAT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.idle-timeout=30000
# Hibernate dialect: the production database is MariaDB (Linux default-mysql-server).
# Same reasoning that forced the override in publiclink-app: the inherited
# MySQL8Dialect can render locking SQL MariaDB does not implement.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Production logging: webhook payloads carry customer messages, keep them out
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.web=WARN

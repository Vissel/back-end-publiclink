spring.profiles.active=@activeProfile@
# Public namespace of this service. The gateway routes /chat/** here, so a client
# call is /apiGateway/chat/api/v1/chat/start and the Zalo webhook is
# /apiGateway/chat/api/v1/chat/zalo/webhook.
spring.webflux.base-path=/chat
spring.application.name=ChatApplication
# CHAT_SERVER_PORT, not SERVER_PORT: all services share one EnvironmentFile, and
# SERVER_PORT defaults already differ per module (9080 publiclink, 8082 user).
server.port=${CHAT_SERVER_PORT:9090}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}

# ── Zalo chat bridge ─────────────────────────────────────────────────────────
# Client chat lives in the web app; the administrator answers from the Zalo app.
# Off by default: with zalo.enabled=false the chat still works through the
# administrator console and nothing is sent outward. Flip it on once an OA exists,
# a Zalo App is registered against it and the OAuth consent has completed.
zalo.enabled=${ZALO_ENABLED:false}
zalo.app-id=${ZALO_APP_ID:}
zalo.secret-key=${ZALO_SECRET_KEY:}
# OA secret key from the Webhook page; the only gate on the public webhook.
zalo.oa-secret-key=${ZALO_OA_SECRET_KEY:}
zalo.oa-id=${ZALO_OA_ID:}
# Zalo user id of the administrator. Leave empty to bind it with the LINK-ADMIN
# handshake instead (the admin messages the OA once).
zalo.admin-user-id=${ZALO_ADMIN_USER_ID:}
zalo.admin-link-code=${ZALO_ADMIN_LINK_CODE:LINK-ADMIN}
# Never disable this in production: the webhook is public and carries no JWT.
zalo.verify-signature=${ZALO_VERIFY_SIGNATURE:true}
zalo.openapi.base-url=${ZALO_OPENAPI_BASE_URL:https://openapi.zalo.me}
zalo.oauth.base-url=${ZALO_OAUTH_BASE_URL:https://oauth.zaloapp.com}
zalo.oauth.redirect-uri=${ZALO_OAUTH_REDIRECT_URI:}
zalo.domain-verification-code=${ZALO_DOMAIN_VERIFICATION_CODE:}
# Optional seed for the first bring-up, before the consent flow is wired up.
zalo.seed-access-token=${ZALO_ACCESS_TOKEN:}
zalo.seed-refresh-token=${ZALO_REFRESH_TOKEN:}
zalo.seed-expires-at=${ZALO_TOKEN_EXPIRES_AT:0}
zalo.dispatch-timeout-millis=8000
# Zalo refuses consultative text longer than 2000 characters.
zalo.max-text-length=2000
# Refresh the 25-hour access token this far ahead of expiry.
zalo.token-refresh-skew-millis=600000

# ── Chat feature tuning ──────────────────────────────────────────────────────
chat.max-message-length=2000
chat.history-limit=500
# Heartbeat keeps nginx from closing an idle event-stream connection.
chat.heartbeat-seconds=20
chat.idle-after-minutes=15
chat.idle-scan-size=500
chat.reply-scan-size=20
chat.receipt-scan-size=100
chat.public-console-url=/adminChat
# User service, only to resolve the human name of a signed-in chat participant
# for the admin console. Best effort: a timeout falls back to the username.
chat.user-service-url=${USER_SERVICE_URL:http://127.0.0.1:8082}
# Console event stream: EventSource cannot send an Authorization header, so the
# console trades a normal JWT call for a single-use ticket that the stream
# endpoint consumes itself (the gateway lets only that one path through).
chat.stream-ticket-ttl-seconds=60
# Keepalive for the administrator stream; an idle SSE is what nginx and the
# tunnel close, and a silently closed stream means silently missed customers.
chat.stream-ping-ms=25000

# ── Browser push (out-of-tab notifications for the console) ────────────────
# Generate once and keep them in the shared EnvironmentFile:
#   npx --yes web-push generate-vapid-keys
# Empty keys leave push off; the console then hides its notification switch
# instead of failing the subscribe call.
chat.vapid.public-key=${CHAT_VAPID_PUBLIC_KEY:}
chat.vapid.private-key=${CHAT_VAPID_PRIVATE_KEY:}
chat.vapid.subject=${CHAT_VAPID_SUBJECT:mailto:admin@share-link.top}
# How long a push service should keep a message when no browser is reachable.
chat.push.ttl-seconds=3600
# Salt rotates fingerprint/IP hashes; changing it unlinks every stored device.
chat.identity.salt=${CHAT_IDENTITY_SALT:publiclink-chat-salt}
chat.identity.fingerprint-threshold=0.8
chat.identity.partial-threshold=0.5
chat.identity.candidate-limit=200

logging.level.org.springframework.web=INFO

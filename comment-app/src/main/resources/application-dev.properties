# Local development profile.
# MySQL Database Configuration (schema: comment_schema)
# The schema must exist before the first start; Liquibase only creates the tables:
#   CREATE DATABASE comment_schema; GRANT ALL ON comment_schema.* TO '<user>'@'localhost';
spring.datasource.url=jdbc:mysql://localhost:3306/comment_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Formysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.hibernate.SQL=DEBUG
# Liquibase Configuration — this module owns its own changelog and schema, so it
# cannot collide with publiclink-db (publiclink-app is the sole DDL owner there).
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Production profile. Values come from the shared EnvironmentFile; every
# secret stays out of the artifact.
# COMMENT_DB_* deliberately, not DB_*: DB_* belongs to publiclink-app and
# USER_DB_*/CHAT_DB_* to the other modules, and all of them read the same
# EnvironmentFile.
spring.datasource.url=${COMMENT_DB_URL:jdbc:mysql://localhost:3306/comment_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${COMMENT_DB_USERNAME}
spring.datasource.password=${COMMENT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.idle-timeout=30000
# Hibernate dialect: the production database is MariaDB (Linux default-mysql-server).
# Same reasoning that forced the override in publiclink-app and chat-app: the
# inherited MySQL8Dialect can render locking SQL MariaDB does not implement.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
logging.level.org.hibernate.SQL=WARN

# QA profile: MySQL, the gateway and the user service run on the Windows
# machine; this service joins the same stack.
server.address=0.0.0.0
# MySQL Database Configuration (schema: comment_schema)
# newuser03 is the established QA application account (user, chat); a comment
# database must not be created under the quota-capped newuser02 account.
spring.datasource.url=jdbc:mysql://localhost:3306/comment_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=newuser03
spring.datasource.password=Newuser00#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Small pool: per-account MySQL resource limits are shared on this host.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# The gateway and publiclink-app are reached by their QA hosts (see the shared
# EnvironmentFile overrides COMMENT_SERVICE_URL on the gateway side).
comment.publiclink-service-url=${PUBLICLINK_SERVICE_URL:http://jade.local:9080}
comment.user-service-url=${USER_SERVICE_URL:http://127.0.0.1:8082}

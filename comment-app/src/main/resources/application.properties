spring.profiles.active=@activeProfile@
# Public namespace of this service. The gateway routes /comment/** here, so a
# client call is /apiGateway/comment/api/v1/public/comments (mirrors chat-app's
# /chat namespace; the gateway strips its own base path before forwarding).
spring.webflux.base-path=/comment
spring.application.name=CommentApplication
# COMMENT_SERVER_PORT, not SERVER_PORT: all services share one EnvironmentFile,
# and SERVER_PORT defaults already differ per module (9080 publiclink, 8082
# user, 9090 chat).
server.port=${COMMENT_SERVER_PORT:9091}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}

# ── Comment feature tuning ───────────────────────────────────────────────────
comment.max-content-length=5000
comment.max-attachments=4
# Bytes live on this host under comment.upload-dir, named by a random storage
# key; only the allow-list in CommentAttachmentDomain enters a comment (same
# policy as chat-app), images are capped at 5 MB and documents at 10 MB, both
# enforced again server-side.
comment.upload-dir=${COMMENT_UPLOAD_DIR:}
comment.max-image-bytes=5242880
comment.max-file-bytes=10485760

# ── Author snapshot (display name + avatar) ──────────────────────────────────
# Both lookups are best effort with a short timeout: the authoritative identity
# is the X-User-ID the gateway forwards from a validated JWT, and a slow or
# down profile service must never block a comment from being posted.
# publiclink-app holds the business-actor row (publiclink-db.user.name), the
# single display-name source of this application; the user service is the
# fallback and the only avatar owner.
comment.publiclink-service-url=${PUBLICLINK_SERVICE_URL:http://127.0.0.1:9080}
comment.user-service-url=${USER_SERVICE_URL:http://127.0.0.1:8082}
# comment_author_avatar is refreshed at most once per this many minutes.
comment.avatar-cache-minutes=60

logging.level.org.springframework.web=INFO

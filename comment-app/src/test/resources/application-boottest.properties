# Context-boot profile: the full Spring wiring and the real Liquibase changelog
# run against an in-memory H2 in MySQL mode, so a missing local MySQL (its home
# is the QA Windows host) never hides a DDL or mapping error.
spring.datasource.url=jdbc:h2:mem:commenttest;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

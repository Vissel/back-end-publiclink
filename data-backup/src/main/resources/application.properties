spring.profiles.active=dev
spring.profiles.default=dev
spring.application.name=DataBackupApplication

# Server
server.port=9090

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# Backup Metadata Database (backup_meta schema)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/backup_meta?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Formysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ============================================================
# Source Databases (read-only connections)
# ============================================================
backup.source.publiclink.url=jdbc:mysql://localhost:3306/publiclink-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&readOnly=true
backup.source.publiclink.username=root
backup.source.publiclink.password=Formysql

backup.source.user.url=jdbc:mysql://localhost:3306/user_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&readOnly=true
backup.source.user.username=root
backup.source.user.password=Formysql

# ============================================================
# SMTP (ProtonMail SMTP Bridge or relay)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# RabbitMQ
# ============================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000

# ============================================================
# Backup Configuration
# ============================================================
backup.storage.base-path=${BACKUP_PATH:/var/backups/publiclink}
backup.otp.ttl-minutes=2
backup.otp.recipient=jelly1512@proton.me

# publiclink-app service URL (for OTP verification)
backup.publiclink.service-url=${PUBLICLINK_SERVICE_URL:http://localhost:9080/publiclink}

# Backup token TTL in minutes
backup.token.ttl-minutes=5

# ============================================================
# Scheduling (cron expressions)
# ============================================================
backup.schedule.daily-cron=0 0 0 * * *
backup.schedule.weekly-cron=0 0 0 * * MON
backup.schedule.monthly-cron=0 0 0 1 * *

# ============================================================
# Logging
# ============================================================
logging.level.com.qrpublic.apartment.databackup=DEBUG
logging.level.org.springframework.security=WARN

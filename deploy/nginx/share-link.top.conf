# /etc/nginx/conf.d/share-link.top.conf
#
# Single public entry point for the PublicLink stack.
#
#   https://share-link.top/apiGateway/*  ->  apiGateway  127.0.0.1:8080
#   https://share-link.top/*             ->  Tomcat     127.0.0.1:8081  (webapps/ROOT)
#
# PREREQUISITE — Tomcat must NOT stay on 8080, the gateway owns that port.
# In $CATALINA_HOME/conf/server.xml change the HTTP connector to 8081:
#     <Connector port="8081" protocol="HTTP/1.1" connectionTimeout="20000" />
# and make sure the connector address is 127.0.0.1 so it is not reachable
# directly from the internet.

upstream publiclink_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream publiclink_tomcat {
    server 127.0.0.1:8081;
    keepalive 32;
}

# --- HTTP -> HTTPS ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name share-link.top www.share-link.top;

    # Keep the ACME challenge reachable for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://share-link.top$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    # NOTE: "listen ... ssl http2" works on nginx 1.9.5 -> 1.27 (it only logs a
    # deprecation warning on 1.25.1+). The standalone "http2 on;" directive
    # does NOT exist before 1.25.1 and will fail "nginx -t" on Ubuntu 22.04
    # (1.18) and 24.04 (1.24). If you are on 1.25.1 or newer you may replace
    # this line with "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    server_name share-link.top www.share-link.top;

    ssl_certificate     /etc/letsencrypt/live/share-link.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share-link.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Excel/QR payloads and product images.
    client_max_body_size 25m;

    # ---------------------------------------------------------------------
    # Server-side only: internal admin registration must come from this host.
    # Evaluated against the true client $remote_addr at the edge, before any
    # request reaches the gateway.
    # ---------------------------------------------------------------------
    location ~ ^/apiGateway/api/v1/user/admin/internal {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://publiclink_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------
    # Chat event stream (Server-Sent Events)
    # ---------------------------------------------------------------------
    # One long-lived response per visitor and one per open admin console.
    # Buffering would hold status frames until the buffer fills, and the read
    # timeout must comfortably outlast the 20s application heartbeat, otherwise
    # nginx closes the stream every couple of minutes and clients reconnect.
    # A regex location cannot carry a URI in proxy_pass, so the /apiGateway
    # prefix is rewritten away instead. The chat namespace belongs to chat-app,
    # which is routed by the gateway as /chat/**.
    location ~ ^/apiGateway/chat/(api|admin)/v1/chat/stream$ {
        rewrite ^/apiGateway(/.*)$ $1 break;
        proxy_pass http://publiclink_gateway;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------
    # Backend: Spring Cloud Gateway
    # ---------------------------------------------------------------------
    # The trailing slash on proxy_pass is REQUIRED. It rewrites
    #   /apiGateway/publiclink/api/v1/publish/order
    # into
    #   /publiclink/api/v1/publish/order
    # which is exactly what GatewayRoutesConfig matches. Removing the slash
    # makes every routed call 404, because the gateway would then look for a
    # route named "/apiGateway/publiclink/**".
    location /apiGateway/ {
        proxy_pass http://publiclink_gateway/;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The gateway streams large/slow responses (Excel export, QR images).
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Bare prefix without the slash — avoid a 404 when someone pokes at it.
    location = /apiGateway {
        return 302 /apiGateway/;
    }

    # ---------------------------------------------------------------------
    # Frontend: React build served from Tomcat's ROOT context
    # ---------------------------------------------------------------------
    # Hashed bundle names never change contents, so cache them hard.
    # Do NOT combine "expires" with add_header Cache-Control: nginx would emit
    # two Cache-Control headers (one from expires, one from add_header).
    location /static/ {
        proxy_pass http://publiclink_tomcat;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://publiclink_tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # Never cache the SPA shell — a stale index.html points at deleted bundles.
    location = /index.html {
        proxy_pass http://publiclink_tomcat;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, must-revalidate";
    }
}

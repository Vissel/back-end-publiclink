# /etc/nginx/sites-available/share-link.top.conf
#
# TUNNEL-MODE VARIANT — use this when Cloudflare Tunnel is the edge.
#
#   Visitor -> Cloudflare edge -> cloudflared tunnel -> http://localhost:80
#
# The tunnel terminates TLS at Cloudflare's edge and delivers plain HTTP
# locally, so this config needs NO 443 listener, NO certificate, and NO
# 301 redirect (a redirect to https would loop through the tunnel forever).
#
# Tunnel ingress (cloudflared config.yml) must point at this nginx:
#     ingress:
#       - hostname: share-link.top
#         service: http://localhost:80
#       - service: http_status:404
#
# Routing:
#   /apiGateway/*  ->  apiGateway  127.0.0.1:8080  (prefix stripped)
#   /*             ->  Tomcat      127.0.0.1:8081  (webapps/ROOT React build)
#
# If you ever switch back to direct public IP + router port-forwarding,
# use share-link.top.conf (the 443/SSL variant) instead.

upstream publiclink_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream publiclink_tomcat {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name share-link.top www.share-link.top;

    # Excel/QR payloads and product images.
    client_max_body_size 25m;

    # ---------------------------------------------------------------------
    # Backend: Spring Cloud Gateway
    # ---------------------------------------------------------------------
    # The trailing slash on proxy_pass is REQUIRED. It rewrites
    #   /apiGateway/publiclink/api/v1/publish/order
    # into
    #   /publiclink/api/v1/publish/order
    # which is exactly what GatewayRoutesConfig matches.
    location /apiGateway/ {
        proxy_pass http://publiclink_gateway/;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The gateway streams large/slow responses (Excel export, QR images).
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Bare prefix without the slash — avoid a 404 when someone pokes at it.
    location = /apiGateway {
        return 302 /apiGateway/;
    }

    # ---------------------------------------------------------------------
    # Frontend: React build served from Tomcat's ROOT context
    # ---------------------------------------------------------------------
    # Hashed bundle names never change contents, so cache them hard.
    location /static/ {
        proxy_pass http://publiclink_tomcat;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://publiclink_tomcat;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # Never cache the SPA shell — a stale index.html points at deleted bundles.
    location = /index.html {
        proxy_pass http://publiclink_tomcat;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, must-revalidate";
    }
}

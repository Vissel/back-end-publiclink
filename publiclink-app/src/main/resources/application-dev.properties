
server.port=9080
server.address=0.0.0.0
#server.servlet.context-path=/publiclink
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/publiclink-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Formysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# SMTP Configuration (for backup OTP)
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Backup OTP Configuration
backup.otp.ttl-minutes=2
backup.otp.recipient=jelly1512@proton.me
backup.token.ttl-minutes=5
# Self-service plan purchase (register -> pick plan -> transfer): the admin whose
# bank transfer accounts receive the money, and who gets the "transfer declared"
# notification to mark it paid. application.properties reads it from
# ${SELF_SERVICE_ADMIN_USERNAME:} and a local run has no such variable, so
# without this line POST /api/v1/sellerPlan/select answers 500
# "Self-service plan purchase is not configured yet."
# The username must own an ACTIVE transfer_info row, otherwise the payment page
# has no receiving account and no VietQR:
#   SELECT owner_username, transfer_issuer, status, is_default
#     FROM transfer_info WHERE owner_type = 'ADMIN';
app.payment.self-service-admin=thachnn

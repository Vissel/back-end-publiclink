spring.application.name=PublicLinkApplication
spring.webflux.base-path=/publiclink
server.port=${SERVER_PORT:9080}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=16
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# SMTP Configuration (for backup OTP)
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Backup OTP Configuration
backup.otp.ttl-minutes=2
backup.otp.recipient=${BACKUP_OTP_RECIPIENT:jelly1512@proton.me}
backup.token.ttl-minutes=5
# Production logging: keep SQL/HTTP payloads out of the logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.web=INFO

spring.application.name=PublicLinkApplication
spring.webflux.base-path=/publiclink
server.port=${SERVER_PORT:9080}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=16
# Hibernate dialect: the production database is MariaDB (Linux default-mysql-server).
# The inherited MySQL8Dialect renders LockModeType.PESSIMISTIC_READ as "for share",
# which MariaDB does not implement -> SQLSyntaxErrorException "near 'share'" on every
# locked read (findSeller, findByReqUUID, order/product/sale-environment finders).
# MariaDBDialect emits "lock in share mode" instead. Set HIBERNATE_DIALECT to the
# MySQL 8 dialect if this profile is ever pointed at a real MySQL server.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}
# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Self-service plan purchase (register -> pick plan -> transfer) reads
# app.payment.self-service-admin, which application.properties maps from
# SELF_SERVICE_ADMIN_USERNAME in /etc/publiclink/publiclink.env (loaded through
# EnvironmentFile by publiclink-app.service). That variable is empty in the
# shipped env file, so the endpoint answers 500 "Self-service plan purchase is
# not configured yet. Please contact admin." and the buyer sees the
# "could not create the order" error.
# Do NOT hardcode app.payment.self-service-admin in this file: a profile-specific
# property outranks application.properties, so it would win over the env variable
# and silently switch the feature back on - the server would then not be running
# what the deployment docs describe. Set it in /etc/publiclink/publiclink.env.
# The username must own an ACTIVE transfer_info row, otherwise the payment page
# has no receiving account and no VietQR:
#   SELECT owner_username, transfer_issuer, status, is_default
#     FROM transfer_info WHERE owner_type = 'ADMIN';
# SMTP Configuration (for backup OTP)
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Backup OTP Configuration
backup.otp.ttl-minutes=2
backup.otp.recipient=${BACKUP_OTP_RECIPIENT:jelly1512@proton.me}
backup.token.ttl-minutes=5
# Production logging: keep SQL/HTTP payloads out of the logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.web=INFO

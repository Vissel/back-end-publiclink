spring.application.name=PublicLinkApplication
spring.webflux.base-path=/publiclink
server.port=9080
server.address=0.0.0.0
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/publiclink-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=newuser02
spring.datasource.password=newuser02pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.rabbitmq.username=publiclink-user
spring.rabbitmq.password=publiclink-user-password

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# SMTP Configuration (for backup OTP)
# BackupOtpService injects JavaMailSender, which MailSenderAutoConfiguration
# only creates when spring.mail.host is set - the same block dev and prod
# carry. Empty credentials still boot the app; mail sending only fails when
# an OTP is actually dispatched.
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Backup OTP Configuration
backup.otp.ttl-minutes=2
backup.otp.recipient=${BACKUP_OTP_RECIPIENT:nguyenjade916@gmail.com}
backup.token.ttl-minutes=5
spring.application.name=PublicLinkApplication
spring.webflux.base-path=/publiclink
server.port=9080
server.address=0.0.0.0
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/publiclink-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=newuser02
spring.datasource.password=newuser02pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.rabbitmq.username=publiclink-user
spring.rabbitmq.password=publiclink-user-password

# Self-service plan sales: the admin whose transfer accounts receive the money,
# and who gets the "transfer declared" notification to verify it. Left blank the
# purchase refuses with 500 "Self-service plan purchase is not configured yet."
# application.properties maps this key from ${SELF_SERVICE_ADMIN_USERNAME}, but
# a profile file outranks application.properties, so the line below wins over
# that variable. Fine here: QA runs from the IDE with no EnvironmentFile and no
# such variable in the process environment at all.
# thachnn owns the ACTIVE default transfer_info row (Vietcombank, NGUYEN NGOC
# THACH) in publiclink-db, so the payment page has a receiving account and
# GenerateQRDomain can build the VietQR from it.
app.payment.self-service-admin=thachnn

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# SMTP Configuration (for backup OTP)
# BackupOtpService injects JavaMailSender, which MailSenderAutoConfiguration
# only creates when spring.mail.host is set - the same block dev and prod
# carry. Empty credentials still boot the app; mail sending only fails when
# an OTP is actually dispatched.
spring.mail.host=${MAIL_HOST:smtp.protonmail.ch}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Backup OTP Configuration
backup.otp.ttl-minutes=2
backup.otp.recipient=${BACKUP_OTP_RECIPIENT:nguyenjade916@gmail.com}
backup.token.ttl-minutes=5

WIN_IP=192.168.1.9
USER_SERVICE_URL=http://${WIN_IP}:8082
SECURITY_SERVICE_URL=http://${WIN_IP}:8080/apiGateway
RABBITMQ_HOST=${WIN_IP}
RABBITMQ_PORT=5672
RABBITMQ_USERNAME=publiclink-user
RABBITMQ_PASSWORD=publiclink-user-password

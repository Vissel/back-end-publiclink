spring.profiles.active=@activeProfile@
spring.webflux.base-path=/publiclink
spring.application.name=PublicLinkApplication
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
# WebFlux Configuration (Reactive, Non-blocking)
server.netty.connection-timeout=60000
# Logging configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Authentication service (SSL/mTLS Configuration)
server.ssl.enabled=false
# Use 'need' to force the client to provide a certificate
#server.ssl.client-auth=need
# Key Store (The server's identity)
server.ssl.key-store=classpath:auth-service/auth.p12
server.ssl.key-store-password=macbook2019
server.ssl.key-store-type=PKCS12
# Trust Store (Who the server trusts)
server.ssl.trust-store=classpath:auth-service/truststore.jks
server.ssl.trust-store-password=macbook2019
# RabbitMQ configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5000
# Template settings
spring.rabbitmq.template.mandatory=true
# Listener settings for simple container
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
link.auth.expired=36000000

# External service URLs (configurable per environment)
user.service.url=${USER_SERVICE_URL:http://localhost:8082}
security.service.url=${SECURITY_SERVICE_URL:http://localhost:8080}

# ── Zalo chat bridge ─────────────────────────────────────────────────────
# Client side of a conversation lives in the app chat; the administrator side is
# the Zalo app. Off until an OA exists, a Zalo App is registered against it and the
# one-time OAuth consent has been completed (POST /admin/v1/chat/zalo/consent/begin).
zalo.enabled=${ZALO_ENABLED:false}
zalo.app-id=${ZALO_APP_ID:}
zalo.secret-key=${ZALO_SECRET_KEY:}
# OA secret key from the Webhook page; required to verify X-ZEvent-Signature.
zalo.oa-secret-key=${ZALO_OA_SECRET_KEY:}
zalo.oa-id=${ZALO_OA_ID:}
# Zalo user id of the administrator. Leave empty to bind it with the LINK-ADMIN
# handshake instead (the admin messages the OA once).
zalo.admin-user-id=${ZALO_ADMIN_USER_ID:}
zalo.admin-link-code=${ZALO_ADMIN_LINK_CODE:LINK-ADMIN}
# Never disable this in production: the webhook is public and carries no JWT.
zalo.verify-signature=${ZALO_VERIFY_SIGNATURE:true}
zalo.openapi.base-url=${ZALO_OPENAPI_BASE_URL:https://openapi.zalo.me}
zalo.oauth.base-url=${ZALO_OAUTH_BASE_URL:https://oauth.zaloapp.com}
zalo.oauth.redirect-uri=${ZALO_OAUTH_REDIRECT_URI:}
zalo.domain-verification-code=${ZALO_DOMAIN_VERIFICATION_CODE:}
# Optional manual seed for the first deployment, before the consent flow is wired up.
zalo.seed-access-token=${ZALO_ACCESS_TOKEN:}
zalo.seed-refresh-token=${ZALO_REFRESH_TOKEN:}
zalo.seed-expires-at=${ZALO_TOKEN_EXPIRES_AT:0}
zalo.dispatch-timeout-millis=8000
# Zalo refuses consultative text longer than 2000 characters.
zalo.max-text-length=2000
# Refresh the 25-hour access token this far ahead of expiry.
zalo.token-refresh-skew-millis=600000

# ── Chat feature tuning ──────────────────────────────────────────────────
chat.max-message-length=2000
chat.history-limit=500
# Heartbeat keeps nginx from closing an idle event-stream connection.
chat.heartbeat-seconds=20
chat.idle-after-minutes=15
chat.idle-scan-size=500
chat.reply-scan-size=20
chat.receipt-scan-size=100
chat.public-console-url=/adminChat
# Salt rotates fingerprint/IP hashes; changing it unlinks every stored device.
chat.identity.salt=${CHAT_IDENTITY_SALT:publiclink-chat-salt}
chat.identity.fingerprint-threshold=0.8
chat.identity.partial-threshold=0.5
chat.identity.candidate-limit=200

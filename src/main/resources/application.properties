spring.application.name=PublicLinkApplication
server.servlet.context-path=/publiclink
server.servlet.session.timeout=15m
jwt.secret=${JWT_KEY}
jwt.secret.url=${JWT_URLKEY}
jwt.url.expired=172800000
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/publiclink-db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Formysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
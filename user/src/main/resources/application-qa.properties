# QA profile for the user service. application.properties carries no
# spring.profiles.active token (this module has no Maven profile filtering), so
# the qa profile is activated at runtime with SPRING_PROFILES_ACTIVE=qa —
# that is how deploy/windows/start-user.bat launches it.
spring.application.name=UserApplication
server.port=8082
server.address=0.0.0.0
# MySQL Database Configuration (schema: user_schema, on the QA Windows machine)
spring.datasource.url=jdbc:mysql://localhost:3306/user_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=newuser03
spring.datasource.password=Newuser00#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.application.name=UserApplication
server.port=${SERVER_PORT:8082}
# Bind loopback only when nginx is the single public entry point; override with
# SERVER_ADDRESS=0.0.0.0 when running without a reverse proxy.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Show detailed health information (including DB status)
management.endpoint.health.show-details=always
# Enable the health endpoint
management.endpoints.web.exposure.include=health
# MySQL Database Configuration
# USER_DB_* is used instead of DB_* because this service shares its
# EnvironmentFile with publiclink-app, which owns the DB_* names.
spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3306/user_schema?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${USER_DB_USERNAME:newuser03}
spring.datasource.password=${USER_DB_PASSWORD:newuser003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.idle-timeout=30000
# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# SSL/mTLS Configuration
server.ssl.enabled=false
# Use 'need' to force the client to provide a certificate
#server.ssl.client-auth=need
# Key Store (The server's identity)
server.ssl.key-store=classpath:auth-service/auth.p12
server.ssl.key-store-password=macbook2019
server.ssl.key-store-type=PKCS12
# Trust Store (Who the server trusts)
server.ssl.trust-store=classpath:auth-service/truststore.jks
server.ssl.trust-store-password=macbook2019
# rsa key pair decryption purpose
# UserConfig reads this with java.nio.file.Paths, so it MUST be an absolute
# filesystem path — a classpath: prefix will not resolve.
rsa-private-key.path=/Users/user/.openssl/auth260222.pem
spring.application.name=UserApplication
server.servlet.context-path=/user
server.port=8082
server.servlet.session.timeout=15m
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://jade.local:3306/publiclink-db?useSSL=false
spring.datasource.username=newuser02
spring.datasource.password=newuser002
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# SSL/mTLS Configuration
server.ssl.enabled=false
# Use 'need' to force the client to provide a certificate
#server.ssl.client-auth=need
# Key Store (The server's identity)
server.ssl.key-store=classpath:auth-service/auth.p12
server.ssl.key-store-password=macbook2019
server.ssl.key-store-type=PKCS12
# Trust Store (Who the server trusts)
server.ssl.trust-store=classpath:auth-service/truststore.jks
server.ssl.trust-store-password=macbook2019